<!DOCTYPE html>
<!-- Ejercicio 11.9: 11.9.html -->
<!-- Traductor de frases en español a latín cerdo (Pig Latin). -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Traductor de Latín Cerdo</title>
        <script src="11.9.js"></script>
    </head>
    <body>
        <h2>Traductor a Latín Cerdo</h2>
        <form action="#">
            <p><textarea id="fraseEspañol" rows="3" cols="50" placeholder="Escriba su frase en español"></textarea></p>
            <p><input id="btnTraducir" type="button" value="Traducir"></p>
        </form>
        <textarea id="resultadoLatin" rows="6" cols="50"></textarea>
    </body>
</html>
