<!DOCTYPE html>
<!-- Ejercicio 11.12: 11.12.html -->
<!-- Impresión de texto en mayúsculas y minúsculas. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Mayúsculas y Minúsculas</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
        </style>
        <script>
            function convertirTexto() {
                var texto = document.getElementById("textoOriginal").value;
                document.getElementById("resMayus").textContent = texto.toUpperCase();
                document.getElementById("resMinus").textContent = texto.toLowerCase();
            }

            function iniciar() {
                document.getElementById("btnConvertir").addEventListener("click", convertirTexto, false);
            }

            window.addEventListener("load", iniciar, false);
        </script>
    </head>
    <body>
        <h2>Conversor de Mayúsculas y Minúsculas</h2>
        <form action="#">
            <p><label>Texto: <input id="textoOriginal" type="text" size="40"></label>
            <input id="btnConvertir" type="button" value="Convertir"></p>
        </form>
        <p><strong>Mayúsculas:</strong> <span id="resMayus"></span></p>
        <p><strong>Minúsculas:</strong> <span id="resMinus"></span></p>
    </body>
</html>
