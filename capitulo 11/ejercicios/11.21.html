<!DOCTYPE html>
<!-- Ejercicio 11.21: 11.21.html -->
<!-- Generar combinaciones de tres letras a partir de una palabra de cinco. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Generador de Cadenas de 3 Letras</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
        </style>
        <script>
            function generarTresLetras() {
                var p = document.getElementById("palabra5").value;
                if ( p.length !== 5 ) {
                    alert("Por favor ingrese exactamente 5 letras.");
                    return;
                }

                var resultados = [];
                for ( var i = 0; i < 5; ++i ) {
                    for ( var j = 0; j < 5; ++j ) {
                        for ( var k = 0; k < 5; ++k ) {
                            if ( i !== j && i !== k && j !== k ) {
                                var combinacion = p.charAt(i) + p.charAt(j) + p.charAt(k);
                                if ( resultados.indexOf( combinacion ) === -1 ) {
                                    resultados.push( combinacion );
                                }
                            }
                        }
                    }
                }

                document.getElementById("areaCombinaciones").value = resultados.join("\n");
            }

            function iniciar() {
                document.getElementById("btnGenerar3").addEventListener("click", generarTresLetras, false);
            }

            window.addEventListener("load", iniciar, false);
        </script>
    </head>
    <body>
        <h2>Combinaciones de 3 Letras</h2>
        <form action="#">
            <p><label>Palabra de 5 letras: <input id="palabra5" type="text" maxlength="5"></label>
            <input id="btnGenerar3" type="button" value="Generar"></p>
        </form>
        <textarea id="areaCombinaciones" rows="10" cols="40" style="margin-top:10px;"></textarea>
    </body>
</html>
