<!DOCTYPE html>
<!-- Ejercicio 11.20: 11.20.html -->
<!-- Versión propia del método lastIndexOf. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Versión Propia de lastIndexOf</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
        </style>
        <script>
            function miLastIndexOf( cadena, busqueda ) {
                var cLen = cadena.length;
                var bLen = busqueda.length;

                if ( bLen === 0 ) return cLen;

                for ( var i = cLen - bLen; i >= 0; --i ) {
                    var encontrada = true;
                    for ( var j = 0; j < bLen; ++j ) {
                        if ( cadena.charAt( i + j ) !== busqueda.charAt( j ) ) {
                            encontrada = false;
                            break;
                        }
                    }
                    if ( encontrada ) return i;
                }
                return -1;
            }

            function probarLast() {
                var texto = "hola mundo, hola a todos";
                var sub = "hola";
                var indice = miLastIndexOf( texto, sub );
                document.getElementById("resMiLast").textContent = "La última ocurrencia de '" + sub + "' está en el índice: " + indice;
            }

            function iniciar() {
                document.getElementById("btnPruebaLast").addEventListener("click", probarLast, false);
            }

            window.addEventListener("load", iniciar, false);
        </script>
    </head>
    <body>
        <h2>Prueba de Mi lastIndexOf</h2>
        <input id="btnPruebaLast" type="button" value="Ejecutar Prueba">
        <p id="resMiLast"></p>
    </body>
</html>
