<!DOCTYPE html>
<!-- Ejercicio 11.19: 11.19.html -->
<!-- Versión propia del método indexOf. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Versión Propia de indexOf</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
        </style>
        <script>
            function miIndexOf( cadena, busqueda ) {
                var cLen = cadena.length;
                var bLen = busqueda.length;

                if ( bLen === 0 ) return 0;

                for ( var i = 0; i <= cLen - bLen; ++i ) {
                    var encontrada = true;
                    for ( var j = 0; j < bLen; ++j ) {
                        if ( cadena.charAt( i + j ) !== busqueda.charAt( j ) ) {
                            encontrada = false;
                            break;
                        }
                    }
                    if ( encontrada ) return i;
                }
                return -1;
            }

            function probarIndex() {
                var texto = "programacion web";
                var sub = "web";
                var indice = miIndexOf( texto, sub );
                document.getElementById("resMiIndex").textContent = "La subcadena '" + sub + "' se encontró en el índice: " + indice;
            }

            function iniciar() {
                document.getElementById("btnPruebaIndex").addEventListener("click", probarIndex, false);
            }

            window.addEventListener("load", iniciar, false);
        </script>
    </head>
    <body>
        <h2>Prueba de Mi indexOf</h2>
        <input id="btnPruebaIndex" type="button" value="Ejecutar Prueba">
        <p id="resMiIndex"></p>
    </body>
</html>
