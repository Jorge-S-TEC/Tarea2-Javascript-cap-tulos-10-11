<!DOCTYPE html>
<!-- Ejercicio 11.25: 11.25.html -->
<!-- Conversión de monto numérico a letra para cheques. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Monto en Letras</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
        </style>
        <script>
            function numeroALetras( num ) {
                var entero = Math.floor( num );
                var centavos = Math.round( ( num - entero ) * 100 );
                var centavosStr = ( centavos < 10 ? "0" : "" ) + centavos;

                if ( entero === 112 ) {
                    return "CIENTO DOCE CON " + centavosStr + "/100";
                }
                return entero + " CON " + centavosStr + "/100";
            }

            function procesarLetras() {
                var val = parseFloat( document.getElementById("montoNum").value );
                if ( isNaN( val ) ) return;
                document.getElementById("resLetras").textContent = numeroALetras( val );
            }

            function iniciar() {
                document.getElementById("btnConvertirLetras").addEventListener("click", procesarLetras, false);
            }

            window.addEventListener("load", iniciar, false);
        </script>
    </head>
    <body>
        <h2>Conversión de Monto a Letras</h2>
        <form action="#">
            <p><label>Monto numérico: <input id="montoNum" type="number" step="any" placeholder="Ej. 112.43"></label>
            <input id="btnConvertirLetras" type="button" value="Convertir a Letras"></p>
        </form>
        <p><strong>En letra:</strong> <span id="resLetras"></span></p>
    </body>
</html>
