<!DOCTYPE html>
<!-- Ejercicio 11.27: 11.27.html -->
<!-- Corrector ortográfico básico con transposiciones y búsqueda en lista. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Corrector Ortográfico</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
        </style>
        <script>
            var listaDePalabras = ["predeterminado", "programa", "javascript", "computadora"];

            function revisarOrtografia() {
                var palabra = document.getElementById("palabraPrueba").value.toLowerCase().trim();
                var salida = document.getElementById("resCorrector");

                if ( listaDePalabras.indexOf( palabra ) !== -1 ) {
                    salida.textContent = "La palabra está escrita correctamente.";
                    return;
                }

                var sugerencia = "";
                for ( var i = 0; i < palabra.length - 1; ++i ) {
                    var arr = palabra.split("");
                    var temp = arr[ i ];
                    arr[ i ] = arr[ i + 1 ];
                    arr[ i + 1 ] = temp;
                    var transpuesta = arr.join("");

                    if ( listaDePalabras.indexOf( transpuesta ) !== -1 ) {
                        sugerencia = transpuesta;
                        break;
                    }
                }

                if ( sugerencia ) {
                    salida.textContent = "La palabra no está escrita correctamente. ¿Quiso decir \"" + sugerencia + "\"?";
                } else {
                    salida.textContent = "La palabra no está escrita correctamente y no se encontraron sugerencias.";
                }
            }

            function iniciar() {
                document.getElementById("btnRevisar").addEventListener("click", revisarOrtografia, false);
            }

            window.addEventListener("load", iniciar, false);
        </script>
    </head>
    <body>
        <h2>Corrector Ortográfico</h2>
        <form action="#">
            <p><label>Palabra: <input id="palabraPrueba" type="text"></label>
            <input id="btnRevisar" type="button" value="Revisar ortografía"></p>
        </form>
        <p id="resCorrector"></p>
    </body>
</html>
