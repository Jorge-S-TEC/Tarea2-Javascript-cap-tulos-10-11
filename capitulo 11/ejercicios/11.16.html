<!DOCTYPE html>
<!-- Ejercicio 11.16: 11.16.html -->
<!-- Filtrar cadenas que terminen con "ed". -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Cadenas que terminan con 'ed'</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
        </style>
        <script>
            function filtrarPorEd() {
                var texto = document.getElementById("cadenasInput16").value;
                var palabras = texto.split(/\s+/);
                var resultado = "";

                for ( var i = 0; i < palabras.length; ++i ) {
                    if ( palabras[ i ].slice( -2 ).toLowerCase() === 'ed' ) {
                        resultado += palabras[ i ] + "\n";
                    }
                }

                document.getElementById("cadenasSalida16").value = resultado;
            }

            function iniciar() {
                document.getElementById("btnFiltrarEd").addEventListener("click", filtrarPorEd, false);
            }

            window.addEventListener("load", iniciar, false);
        </script>
    </head>
    <body>
        <h2>Filtrar Cadenas que terminan con 'ed'</h2>
        <form action="#">
            <p><textarea id="cadenasInput16" rows="5" cols="40" placeholder="Ingrese palabras..."></textarea></p>
            <p><input id="btnFiltrarEd" type="button" value="Filtrar"></p>
        </form>
        <textarea id="cadenasSalida16" rows="5" cols="40"></textarea>
    </body>
</html>
