<!DOCTYPE html>
<!-- Ejercicio 11.10: 11.10.html -->
<!-- Extracción de partes de un número telefónico usando split. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Formato de Número Telefónico</title>
        <script src="11.10.js"></script>
    </head>
    <body>
        <h2>Desglose de Teléfono (Formato: (555)555-5555)</h2>
        <form action="#">
            <p><label>Teléfono: <input id="telefonoInput" type="text" placeholder="(555)555-5555"></label>
            <input id="btnExtraer" type="button" value="Extraer Partes"></p>
        </form>
        <p><label>Código de área: <input id="areaOutput" type="text" readonly></label></p>
        <p><label>Número de teléfono: <input id="numeroOutput" type="text" readonly></label></p>
    </body>
</html>
