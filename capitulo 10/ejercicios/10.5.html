<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 10.5 - Corrección de Errores</title>
        <script>
            function ejecutarCorrecciones() {
                var salida = "<h3>Corrección 5.a (Arreglo B):</h3>";
                // Corrección a): longitud correcta y uso de variable de control i en vez de índice fijo 1
                var b = new Array( 10 );
                var longitud = b.length;
                for ( var i = 0; i < longitud; ++i ) {
                    b[ i ] = 1;
                }
                salida += "<p>b = [ " + b.join(", ") + " ]</p>";

                salida += "<h3>Corrección 5.b (Arreglo A Bidimensional):</h3>";
                // Corrección b): Sintaxis correcta de corchetes separados [1][1] en lugar de [1, 1]
                var a = [ [ 1, 2 ], [ 3, 4 ] ];
                a[ 1 ][ 1 ] = 5;
                salida += "<p>a[1][1] modificado correctamente a 5. Nueva estructura fila 1: " + a[1].join(", ") + "</p>";

                document.getElementById("resultado").innerHTML = salida;
            }

            window.addEventListener("load", function() {
                document.getElementById("btnEjecutar").addEventListener("click", ejecutarCorrecciones, false);
            }, false);
        </script>
    </head>
    <body>
        <h2>Ejercicio 10.5: Errores Corregidos y Ejecutados</h2>
        <input id="btnEjecutar" type="button" value="Ejecutar Código Corregido">
        <div id="resultado"></div>
    </body>
</html>
