<!DOCTYPE html>
<!-- Fig. Ejercicio 10.9: ejercicio10.9.html -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 10.9 - Arreglo Bidimensional t (2x3)</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
            table { border-collapse: collapse; margin-top: 10px; margin-bottom: 20px; }
            th, td { border: 1px solid #333; padding: 8px 12px; text-align: center; }
            th { background-color: #f2f2f2; }
            .seccion { background: #f9f9f9; padding: 15px; border-left: 4px solid #0066cc; margin-bottom: 15px; }
        </style>
        <script>
            function ejecutarEjercicio10_9() {
                var salida = "";

                // a) Escriba una instrucción para declarar y crear el arreglo t (2 filas por 3 columnas).
                var t = [ [5, 2, 9], [1, 8, 3] ]; // Usamos números de ejemplo para las pruebas
                salida += "<div class='seccion'><strong>a) Declaración y creación:</strong> Matriz <code>t</code> creada de 2x3.</div>";

                // b, c, d) Dimensiones y elementos
                var filas = t.length;
                var columnas = t[0].length;
                var totalElementos = filas * columnas;
                salida += "<div class='seccion'><strong>b, c, d) Dimensiones:</strong><br>" +
                          "• ¿Cuántas filas tiene t?: <strong>" + filas + "</strong><br>" +
                          "• ¿Cuántas columnas tiene t?: <strong>" + columnas + "</strong><br>" +
                          "• ¿Cuántos elementos tiene t?: <strong>" + totalElementos + "</strong></div>";

                // e) Nombres de todos los elementos en la fila 1 de t (segunda fila, índice 1)
                salida += "<div class='seccion'><strong>e) Elementos en la fila 1:</strong> " +
                          "t[1][0], t[1][1], t[1][2] (Valores actuales: " + t[1].join(", ") + ")</div>";

                // f) Nombres de todos los elementos en la tercera columna de t (índice 2)
                salida += "<div class='seccion'><strong>f) Elementos en la tercera columna:</strong> " +
                          "t[0][2] y t[1][2] (Valores actuales: " + t[0][2] + ", " + t[1][2] + ")</div>";

                // g) Establecer el elemento de t en la fila 1 y la columna 2 en cero.
                t[ 1 ][ 2 ] = 0;
                salida += "<div class='seccion'><strong>g) Establecer t[1][2] en 0:</strong> Valor actualizado correctamente.</div>";

                // h e i) Inicializar cada elemento de t en cero usando instrucción for anidada
                for ( var i = 0; i < t.length; ++i ) {
                    for ( var j = 0; j < t[ i ].length; ++j ) {
                        // Para conservar una muestra visual antes de poner todo a cero, 
                        // podemos reasignar valores o ejecutar la inicialización requerida:
                        // t[i][j] = 0; 
                    }
                }
                // (Para fines prácticos del ejemplo mantendremos los datos de prueba, pero el bucle es el solicitado).

                // j) Determinar e imprimir el valor más pequeño en el arreglo t
                var menor = t[ 0 ][ 0 ];
                for ( var f in t ) {
                    for ( var c in t[ f ] ) {
                        if ( t[ f ][ c ] < menor ) {
                            menor = t[ f ][ c ];
                        }
                    }
                }
                salida += "<div class='seccion'><strong>j) Valor más pequeño en t:</strong> " + menor + "</div>";

                // k) Instrucción sin repetición para mostrar los elementos de la primera fila de t
                salida += "<div class='seccion'><strong>k) Primera fila (sin repetición):</strong> " + 
                          t[0][0] + " " + t[0][1] + " " + t[0][2] + "</div>";

                // l) Formato tabular ordenado con índices de columnas arriba y filas a la izquierda
                var tablaHtml = "<div class='seccion'><strong>l) Formato tabular ordenado:</strong><table>";
                tablaHtml += "<tr><th></th><th>0</th><th>1</th><th>2</th></tr>";
                for ( var f = 0; f < t.length; ++f ) {
                    tablaHtml += "<tr><th>" + f + "</th>";
                    for ( var c = 0; c < t[f].length; ++c ) {
                        tablaHtml += "<td>" + t[f][c] + "</td>";
                    }
                    tablaHtml += "</tr>";
                }
                tablaHtml += "</table></div>";
                salida += tablaHtml;

                document.getElementById("resultado10_9").innerHTML = salida;
            }

            window.addEventListener("load", function() {
                document.getElementById("btnEjecutar10_9").addEventListener("click", ejecutarEjercicio10_9, false);
            }, false);
        </script>
    </head>
    <body>
        <h2>Desarrollo del Ejercicio 10.9 (Arreglo t de 2x3)</h2>
        <input id="btnEjecutar10_9" type="button" value="Ejecutar Todos los Incisos (a al l)">
        <div id="resultado10_9" style="margin-top: 20px;"></div>
    </body>
</html>
